
name: Diabetes ML CI

# Run automatically on pushes and pull requests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-train:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download project code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      # Step 4: Check Python code quality
      - name: Run Ruff linting
        run: python -m ruff check .

      # Step 5: Train the model and save metrics
      - name: Train baseline model
        run: python train.py

      # Step 6: Run automated tests
      - name: Run unit tests
        run: python -m pytest tests/ -v

      # Step 7: Upload model and metrics
      - name: Upload training artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diabetes-model-artifacts
          path: |
            artifacts/model.joblib
            artifacts/metrics.json
          if-no-files-found: error
